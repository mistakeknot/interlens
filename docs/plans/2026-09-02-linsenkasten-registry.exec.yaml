version: 1
mode: dependency-driven
tier: deep
max_parallel: 3
timeout_per_task: 900

# Landing rule (plan Task 1, Step 1): tasks marked sweep_gate wait until
# `git log --oneline main..sweep/2026-09-02 | wc -l` prints 0 and the branch is rebased.

stages:
  - name: "A — Baseline"
    tasks:
      - id: task-1
        title: "Baseline, node test scaffold, CI node step (CI edit behind sweep gate)"
        files: [packages/mcp/test/smoke.test.mjs, packages/mcp/package.json, .github/workflows/ci.yml]
        depends: []
  - name: "B — Local engine (curated layer)"
    tasks:
      - id: task-2
        title: "Move curated data to data/curated/"
        files: [data/curated/lenses.json, data/curated/connections.json, data/curated/frames.json, data/README.md]
        depends: [task-1]
      - id: task-3
        title: "lib/store.js + constants.js: load layers, lexical search, lookups"
        files: [packages/mcp/lib/store.js, packages/mcp/lib/constants.js, packages/mcp/test/store.test.mjs]
        depends: [task-2]
      - id: task-4
        title: "lib/graph.js: port graph.py and creative queries"
        files: [packages/mcp/lib/graph.js, packages/mcp/test/graph.test.mjs]
        depends: [task-3]
      - id: task-5
        title: "lib/embed.js: Ollama client, matrix loader, cosine top-k"
