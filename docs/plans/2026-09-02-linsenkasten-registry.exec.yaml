        depends: [task-3, task-4, task-5]
      - id: task-7
        title: "CLI on the local engine"
        files: [packages/mcp/cli.js]
        depends: [task-6]
  - name: "C — Harvest pipeline and generated layer"
    tasks:
      - id: task-8
        title: "harvest/scan.py + thresholds + package + fixtures"
        files: [harvest/__init__.py, harvest/__main__.py, harvest/thresholds.py, harvest/scan.py, tests/harvest/conftest.py, tests/harvest/test_scan.py]
        depends: [task-2]
      - id: task-9
